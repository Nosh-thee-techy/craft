# Purpose: Render Blueprint for the public web service + Postgres.
# Inputs: repo env vars set in the Render dashboard (never committed).
# Outputs: a public URL so PayPal sandbox webhooks can reach /api/paypal/webhook.
services:
  - type: web
    name: craft
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_ENV_VALIDATION
        value: "1"
      - key: APP_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: craft-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false

databases:
  - name: craft-db
    plan: basic-256mb
    postgresMajorVersion: "16"
