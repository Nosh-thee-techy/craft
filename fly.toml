# Purpose: Fly.io app config for CRAFT (Next.js + private vault volume).
# Inputs: secrets set via `fly secrets` (DATABASE_URL, AUTH_SECRET, APP_URL, …).
# Outputs: public HTTPS app; PayPal webhooks hit /api/paypal/webhook.
#
# App name is set at `fly apps create`. Region: lhr (London) — close to KE/EU judges.

app = "craft-studio-ke"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  PAYPAL_ENV = "sandbox"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"

[mounts]
  source = "craft_vault"
  destination = "/app/.data"
  initial_size = "1gb"
