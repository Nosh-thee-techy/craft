# Purpose: Local Postgres with pgvector for Phase 0 migrations.
# Inputs: none (default user/password/db are craft/craft/craft).
# Outputs: postgres on localhost:5432.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: craft
      POSTGRES_PASSWORD: craft
      POSTGRES_DB: craft
    ports:
      - "5432:5432"
    volumes:
      - craft_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craft -d craft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  craft_pg:
